[workspace]
resolver = "2"
members = ["crates/riscv-core", "crates/runtime", "crates/native"]
default-members = ["crates/riscv-core", "crates/runtime", "crates/native"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
