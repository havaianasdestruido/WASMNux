[workspace]
resolver = "2"
members = [
    "crates/wasmnux-riscv",
    "crates/wasmnux-storage",
    "crates/wasmnux-virtio",
    "crates/wasmnux-net",
    "crates/wasmnux-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/havaianasdestruido/WASMNux"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
