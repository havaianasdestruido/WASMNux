name: fmt-fix (manual helper)

# The primary dev sandbox has no Rust toolchain, so rustfmt runs here and
# the resulting patch is uploaded for the developer to apply. CI still
# enforces `cargo fmt -- --check` on every push; this only *produces* fixes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Produce patch
        run: git diff > rustfmt.patch; wc -l rustfmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
