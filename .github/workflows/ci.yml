name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# pull-requests:write is ONLY for the DIAGNOSTICS steps below: the primary
# dev sandbox can reach api.github.com but not Actions log/artifact hosts,
# so failure output is mirrored as PR comments to iterate with real
# evidence. Remove the DIAGNOSTICS steps + this permission once development
# happens somewhere with direct log access.
permissions:
  contents: read
  pull-requests: write

jobs:
  fmt:
    name: Rust formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        id: fmtcheck
        run: cargo fmt --all -- --check
      - name: DIAGNOSTICS — post the rustfmt patch to the PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff > rustfmt.patch
          echo "patch bytes: $(wc -c < rustfmt.patch)"
          PR=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then echo "no open PR for $GITHUB_REF_NAME; skipping diagnostics"; exit 0; fi
          mkdir -p patch-parts
          split -b 40000 -d rustfmt.patch patch-parts/part-
          TOTAL=$(ls patch-parts | wc -l)
          I=0
          for part in patch-parts/*; do
            I=$((I+1))
            {
              printf '<!-- wasmnux-diagnostics fmt-patch run-%s part-%s-of-%s sha-%s -->\n' "$GITHUB_RUN_ID" "$I" "$TOTAL" "$GITHUB_SHA"
              printf '**CI diagnostics:** rustfmt patch part %s/%s (run %s). Apply the concatenated diff, then re-push.\n\n' "$I" "$TOTAL" "$GITHUB_RUN_ID"
              printf '```diff\n'
              cat "$part"
              printf '\n```\n'
            } > comment.md
            gh pr comment "$PR" --body-file comment.md
          done

  rust:
    name: Rust core (clippy, test, wasm build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned stable + wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (warnings are errors)
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log
      - name: Unit + integration tests
        run: |
          set -o pipefail
          cargo test --workspace --all-features 2>&1 | tee test.log
      - name: WebAssembly build
        run: |
          set -o pipefail
          cargo build -p wasmnux-wasm --target wasm32-unknown-unknown --release 2>&1 | tee wasm.log
      - name: Generate wasm-bindgen JS package
        run: |
          set -o pipefail
          # Must exactly match the pinned wasm-bindgen crate version.
          (cargo install wasm-bindgen-cli --version 0.2.130 --locked) 2>&1 | tee bindgen.log
          mkdir -p wasm-pkg
          wasm-bindgen --target web --out-dir wasm-pkg \
            target/wasm32-unknown-unknown/release/wasmnux_wasm.wasm
          ls -l wasm-pkg
      - name: Upload WASM package artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasmnux-wasm-pkg
          path: wasm-pkg
          if-no-files-found: error
      - name: DIAGNOSTICS — post failure logs to the PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then echo "no open PR; skipping diagnostics"; exit 0; fi
          {
            printf '<!-- wasmnux-diagnostics rust-log run-%s sha-%s -->\n' "$GITHUB_RUN_ID" "$GITHUB_SHA"
            printf '**CI diagnostics:** Rust job failed in run %s. Tail of captured logs:\n\n' "$GITHUB_RUN_ID"
            for f in clippy.log test.log wasm.log bindgen.log; do
              if [ -f "$f" ]; then
                printf '### %s (last 200 lines)\n```\n' "$f"
                tail -n 200 "$f" | head -c 18000
                printf '\n```\n'
              fi
            done
          } > comment.md
          gh pr comment "$PR" --body-file comment.md

  web:
    name: Web app (typecheck, lint, unit tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Typecheck (strict)
        run: npm --prefix web run typecheck 2>&1 | tee web-typecheck.log
      - name: Lint
        run: npm --prefix web run lint 2>&1 | tee web-lint.log
      - name: Unit tests
        run: npm --prefix web test 2>&1 | tee web-test.log
      - name: Production build
        run: npm --prefix web run build 2>&1 | tee web-build.log
      - name: DIAGNOSTICS — post failure logs to the PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then exit 0; fi
          {
            printf '<!-- wasmnux-diagnostics web-log run-%s sha-%s -->\n' "$GITHUB_RUN_ID" "$GITHUB_SHA"
            printf '**CI diagnostics:** web job failed in run %s.\n\n' "$GITHUB_RUN_ID"
            for f in web-typecheck.log web-lint.log web-test.log web-build.log; do
              if [ -f "$f" ]; then printf '### %s\n```\n' "$f"; tail -n 120 "$f" | head -c 12000; printf '\n```\n'; fi
            done
          } > comment.md
          gh pr comment "$PR" --body-file comment.md

  e2e:
    name: Browser e2e (Playwright + real WASM core)
    needs: [rust, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Place the CI-built WASM core where the worker loads it
        uses: actions/download-artifact@v4
        with:
          name: wasmnux-wasm-pkg
          path: web/public/wasm
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright suite
        working-directory: web
        run: |
          set -o pipefail
          # Must run from web/ so playwright.config.ts (testDir=e2e/) applies;
          # from the repo root Playwright defaults would swallow vitest files.
          { echo "== web/public/wasm contents =="; ls -l public/wasm || true; echo "== playwright =="; } | tee ../e2e.log
          npx playwright test 2>&1 | tee -a ../e2e.log
      - name: DIAGNOSTICS — post failure log to the PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then exit 0; fi
          {
            printf '<!-- wasmnux-diagnostics e2e-log run-%s sha-%s -->\n' "$GITHUB_RUN_ID" "$GITHUB_SHA"
            printf '**CI diagnostics:** e2e job failed in run %s.\n\n```\n' "$GITHUB_RUN_ID"
            tail -n 150 e2e.log | head -c 20000
            printf '\n```\n'
            for ctx in web/test-results/**/error-context.md; do
              if [ -f "$ctx" ]; then printf '### %s\n```\n' "$ctx"; head -c 6000 "$ctx"; printf '\n```\n'; fi
            done
          } > comment.md
          gh pr comment "$PR" --body-file comment.md
