name: CI
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: rustfmt, clippy, rust-src
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo check
      - run: cargo test
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo build -p wasmnux-runtime --target wasm32-unknown-unknown -Z build-std=std,panic_abort --release
        env:
          RUSTC_BOOTSTRAP: 1
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # Real guest/browser E2E requires the pinned Chromium and persistent OPFS
      # quota; it is run locally and recorded in docs/TEST_REPORT.md rather than
      # silently skipped or mocked in CI.
