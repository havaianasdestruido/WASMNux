name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Bootstrap Rust & cross-compilation toolchains
        run: ./scripts/setup-toolchains.sh

      - name: Install npm dependencies
        run: npm ci

      - name: Rust formatting check
        run: cargo fmt --all -- --check

      - name: Rust workspace check & Clippy
        run: |
          cargo check --workspace
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust unit & integration tests
        run: cargo test --workspace

      - name: Build WASM runtime
        run: ./scripts/build-wasm.sh

      - name: TypeScript format, lint, and strict typecheck
        run: |
          npm run format:check
          npm run lint
          npm run typecheck

      - name: Vitest unit & integration tests
        run: npm test

      - name: Build web application & run Playwright E2E suite
        run: |
          npm run build
          npm run test:e2e
