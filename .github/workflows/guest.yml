name: Guest images

# Heavyweight guest builds (kernel/Debian take tens of minutes) are manual.
# The fast BusyBox+initramfs pipeline can also be triggered by touching
# guest/.build-trigger, which works before this workflow lands on main
# (workflow_dispatch requires the file on the default branch).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        options: [vanilla, Debian, all]
        default: vanilla
  push:
    paths: ["guest/.build-trigger"]

permissions:
  contents: read
  pull-requests: write

jobs:
  busybox-initramfs:
    name: BusyBox (riscv64) + Vanilla initramfs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static file cpio gzip bc texinfo
      - name: Cache the soft-float musl cross toolchain
        id: musl-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/guest/build/musl-cross
          key: musl-rv64imac-lp64-${{ hashFiles('guest/scripts/build-musl-toolchain.sh') }}
      - name: Build soft-float musl cross toolchain (distro glibc is lp64d-only)
        if: steps.musl-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          ./guest/scripts/build-musl-toolchain.sh "$GITHUB_WORKSPACE/guest/build/musl-cross" 2>&1 | tee musl-toolchain.log
      - name: Use the musl toolchain for the BusyBox build
        run: echo "$GITHUB_WORKSPACE/guest/build/musl-cross/bin" >> "$GITHUB_PATH"
      - name: Resolve upstream versions (no hardcoding)
        run: ./guest/scripts/versions.sh all
      - name: Build BusyBox and enforce applet list
        run: |
          set -o pipefail
          CROSS_COMPILE=riscv64-linux-musl- ./guest/scripts/build-busybox.sh "$GITHUB_WORKSPACE/guest/build/vanilla-rootfs" 2>&1 | tee busybox-build.log
      - name: Behaviour-test the riscv64 BusyBox under qemu-user
        run: |
          QEMU=$(command -v qemu-riscv64-static)
          run_bb() { "$QEMU" "$GITHUB_WORKSPACE/guest/build/vanilla-rootfs/bin/busybox" "$@"; }
          # The behaviour harness takes a binary path; wrap it for qemu.
          mkdir -p /tmp/bbwrap
          printf '#!/bin/sh\nexec %s %s "$@"\n' "$QEMU" "$GITHUB_WORKSPACE/guest/build/vanilla-rootfs/bin/busybox" > /tmp/bbwrap/busybox
          chmod +x /tmp/bbwrap/busybox
          /tmp/bbwrap/busybox uname -m || run_bb uname -m
          sh guest/tests/busybox-applets.sh /tmp/bbwrap/busybox
      - name: Build initramfs
        run: ./guest/scripts/build-initramfs.sh "$GITHUB_WORKSPACE/guest/build/vanilla-rootfs" "$GITHUB_WORKSPACE/guest/build/initramfs.cpio.gz"
      - name: DIAGNOSTICS — post failure log to the PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then exit 0; fi
          {
            printf '<!-- wasmnux-diagnostics guest-log run-%s sha-%s -->\n' "$GITHUB_RUN_ID" "$GITHUB_SHA"
            printf '**CI diagnostics:** guest busybox/initramfs job failed in run %s.\n\n```\n' "$GITHUB_RUN_ID"
            for f in musl-toolchain.log busybox-build.log; do
              if [ -f "$f" ]; then
                printf '### %s (error lines)\n' "$f"
                grep -n -i -m 40 -E "error:|Error [0-9]|No such file|not found|FAILED|Killed|Out of memory" "$f" | head -c 9000 || true
                printf '\n### %s (tail)\n' "$f"
                tail -n 60 "$f" | head -c 9000
                printf '\n'
              fi
            done
            printf '\n```\n'
          } > comment.md
          gh pr comment "$PR" --body-file comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-initramfs
          path: guest/build/initramfs.cpio.gz
          if-no-files-found: error

  opensbi:
    name: OpenSBI fw_jump
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu
      - run: ./guest/scripts/build-opensbi.sh "$GITHUB_WORKSPACE/guest/build/opensbi"
      - uses: actions/upload-artifact@v4
        with:
          name: opensbi
          path: guest/build/opensbi

  kernel:
    name: Linux kernel (latest stable, riscv64)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu bc flex bison libssl-dev libelf-dev dwarves xz-utils
      - run: ./guest/scripts/build-kernel.sh "$GITHUB_WORKSPACE/guest/build/kernel"
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: guest/build/kernel

  package:
    name: Package guest profiles
    if: github.event_name == 'workflow_dispatch'
    needs: [busybox-initramfs, opensbi, kernel]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package Vanilla profile
        run: |
          ./guest/scripts/package-profile.sh vanilla \
            artifacts/kernel artifacts/opensbi \
            artifacts/vanilla-initramfs/initramfs.cpio.gz \
            "$GITHUB_WORKSPACE/dist-guest/vanilla"
      - name: Build + package Debian root image
        if: inputs.target == 'Debian' || inputs.target == 'all'
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap debian-archive-keyring qemu-user-static e2fsprogs
          sudo ./guest/scripts/build-Debian.sh "$GITHUB_WORKSPACE/guest/build/Debian" 2048
          ./guest/scripts/package-profile.sh Debian \
            artifacts/kernel artifacts/opensbi \
            guest/build/Debian/debian-*.img \
            "$GITHUB_WORKSPACE/dist-guest/Debian"
      - uses: actions/upload-artifact@v4
        with:
          name: guest-profiles
          path: dist-guest
          if-no-files-found: error
