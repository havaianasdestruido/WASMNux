<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WASMNux — Browser-Native Linux</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
        background: #0b0c10;
        color: #c0c0c0;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        padding: 8px;
        background: #12141c;
        border-bottom: 1px solid #2a2f3e;
      }
      select,
      button {
        padding: 6px 10px;
        font-size: 14px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .main {
        display: flex;
        height: calc(100vh - 44px);
      }
      .panel {
        flex: 0 0 260px;
        border-right: 1px solid #2a2f3e;
        padding: 12px;
        overflow: auto;
        font-size: 13px;
      }
      .stage {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      #terminal {
        flex: 1;
        background: #000;
        border: none;
      }
      #gfx {
        flex: 0 0 240px;
        background: #000;
      }
      .caps {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 12px;
        line-height: 1.6;
        margin-top: 8px;
        border-top: 1px solid #2a2f3e;
        padding-top: 8px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      label {
        font-size: 12px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <label>Profile</label>
      <select id="profile-select">
        <option value="vanilla">Vanilla Linux (BusyBox)</option>
        <option value="debian">Debian (stable)</option>
      </select>
      <button id="boot-btn">Boot</button>
      <button id="shutdown-btn">Shutdown</button>
      <button id="reboot-btn">Reboot</button>
      <span id="status" style="margin-left: auto; font-family: monospace"
        >status: stopped</span
      >
    </div>
    <div class="main">
      <div class="panel">
        <div>Controls</div>
        <div class="caps" id="caps">detecting capabilities…</div>
      </div>
      <div class="stage">
        <div id="terminal"></div>
        <canvas id="gfx" width="640" height="480"></canvas>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
